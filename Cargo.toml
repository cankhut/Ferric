[package]
name = "ferric"
version = "1.1.0"
edition = "2021"
description = "A desktop app for rating the albums you listen to"
license = "MIT"
repository = "https://github.com/cankhut/ferric"

# Everything that knows nothing about the screen
[lib]
name = "ferric"
path = "src/lib.rs"

# The window
[[bin]]
name = "ferric"
path = "src/main.rs"

[dependencies]
# The window and its widgets
eframe = "0.29"

# What lets egui load a cover straight from a URL
egui_extras = { version = "0.29", features = ["image", "http"] }

# Only the two formats album covers ever come in. The default feature set
# is every format there is, which is a lot of code for nothing
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
] }

# Saving the library and the settings as JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Blocking HTTP. The window runs it on a thread, so nothing freezes
ureq = "2"

# Dates for "added on"
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }

# Error handling that reads well in a small app
anyhow = "1"

# Only on Windows, only at build time, and only to put the icon on the
# .exe. See build.rs: if it cannot, the build carries on without it
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# A smaller, faster binary, at the cost of a slower release build. Debug
# builds are untouched, so `cargo run` is as quick as it was
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
